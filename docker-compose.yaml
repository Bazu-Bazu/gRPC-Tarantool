services:
  tarantool:
    build:
      context: ./tarantool
      dockerfile: Dockerfile
    container_name: tarantool-kv
    ports:
      - "3301:3301"
    volumes:
      - tarantool_data:/var/lib/tarantool
    restart: unless-stopped

  grpc-service:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: grpc-service
    environment:
      TARANTOOL_SERVER_HOST: tarantool
      TARANTOOL_SERVER_PORT: 3301
      SERVER_PORT: 8080
      GRPC_SERVER_PORT: 9090
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  tarantool_data: